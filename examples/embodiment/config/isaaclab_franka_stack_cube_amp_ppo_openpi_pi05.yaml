defaults:
  - env/isaaclab_stack_cube@env.train
  - env/isaaclab_stack_cube@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "${oc.env:EMBODIED_PATH}/../../results"
    project_name: rlinf
    experiment_name: "isaaclab_amp_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 10

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 2
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 3
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  collect_transitions: True

  train:
    total_num_envs: 64
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    use_fixed_reset_state_ids: True
    seed: 42

  eval:
    total_num_envs: 32
    max_episode_steps: 450
    max_steps_per_rollout_epoch: 450
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    seed: 42

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  collect_transitions: True

  model:
    model_path: "/path/to/model/RLinf-Pi05-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 512
  seed: 42
  enable_offload: False

  model:
    model_path: "/path/to/model/RLinf-Pi05-SFT"
    model_type: "openpi"
    action_dim: 7
    num_action_chunks: 5
    num_steps: 5
    add_value_head: True
    openpi:
      config_name: "pi05_isaaclab_stack_cube"
      num_images_in_input: 2
      noise_level: 0.5
      joint_logprob: False
      num_steps: ${actor.model.num_steps}
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

# ── AMP (Adversarial Motion Priors) ────────────────────────────────────────
# Option B: eef_pos only (3-dim). No env changes required.
# The actor mixin extracts states[..., 0:3] from the existing rollout states.
amp:
  enabled: true
  # Override at CLI with amp.hdf5_path=/workspace/RLinf/datasets/rendered.hdf5
  hdf5_path: "/path/to/datasets/rendered.hdf5"

  # Option C: full states vector (8-dim) — matches IsaaclabStackCubeEnv._wrap_obs exactly.
  # states = [eef_pos(3) | axis_angle(3) | gripper_pos(2)]
  # axis_angle is converted from eef_quat at dataset load time. No env changes needed.
  obs_terms: [eef_pos, axis_angle, gripper_pos]

  # Total reward = (1 - task_reward_lerp) * amp_reward + task_reward_lerp * task_reward
  reward_coef: 0.5
  task_reward_lerp: 0.9

  discr_hidden_dims: [256, 256]

  discr_lr: 1.0e-4
  discr_weight_decay_trunk: 1.0e-4
  discr_weight_decay_head: 1.0e-2

  grad_pen_lambda: 10.0

  replay_buffer_size: 100000

  mini_batch_size: 512
  num_discr_updates: 4

  # Set to an integer to load only the first N demos (useful for quick tests)
  demo_limit: null

  # Save per-step reward arrays to disk for later analysis / reward labeling.
  # Each step writes step_XXXXXX.npz with keys: amp_reward, task_reward, mixed_reward.
  save_rewards: false
  reward_save_path: "/workspace/RLinf/rewards"
